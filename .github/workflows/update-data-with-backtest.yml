name: Update Football Data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update football statistics
        run: python sync.py

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add football_model_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Automatic football data update"
            git push
          else
            echo "No data changes"
          fi

      - name: Run historical baseline backtest
        run: python backtest.py

      - name: Upload backtest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-backtest-results
          path: |
            backtest_report.json
            backtest_results.csv
          if-no-files-found: warn
          retention-days: 30
